<div class="login-box">
    <div class="auth-logo mb-3">
        <img src="../../static/logo.png" alt="Logo">
    </div>
    <div class="auth-header mb-3"><h1>Вход</h1></div>
    <form class="auth-inputs">
        <div class="mb-2">
            <div class="input-group has-validation">
                <span class="input-group-text"><i class="fas fa-envelope-open "></i></span>
                <input type="text" id="email" class="form-control" aria-describedby="inputGroupPrepend"
                       placeholder="Электронная почта" required>
                <div class="invalid-feedback">
                    Введите корректно почту
                </div>
            </div>
        </div>
        <div class="mb-2">
            <div class="input-group has-validation">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" class="form-control" id="password" aria-describedby="inputGroupPrepend" placeholder="Пароль"
                       required>
                <div class="invalid-feedback">
                    Введите корректно пароль
                </div>
            </div>
        </div>
        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
            <label class="form-check-label" for="flexCheckDefault" id="remember-me">
                Запомнить меня
            </label>
        </div>
        <div class="login-actions">
            <button type="button" class="btn btn-primary btn-block w-100" id="process-button">Войти</button>
        </div>
    </form>
    <div class="social-auth-links mt-2">
        <p>Еще нет аккаунта? <a href="/sign-up"> Пройдите регистрацию</a></p>
    </div>
</div>
